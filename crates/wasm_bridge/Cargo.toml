[package]
name = "wasm_bridge"
version = "0.1.0"
edition = "2024"
description = "WASM bridge: named-surface ABI between Rust math/render state and the Svelte frontend (AD-5)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
core_math = { path = "../core_math" }
render = { path = "../render" }
wasm-bindgen = "0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
