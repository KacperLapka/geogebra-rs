[package]
name = "api"
version = "0.1.0"
edition = "2024"
description = "Axum JSON blob store for workspace snapshots (AD-6). No math evaluation, no auth."
license = "MIT"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
