title = "SQLite store with fast unique slugs"
description = "Builds on entry 1 POST contract to swap the store body to a sqlx SQLite file keeping put/get, with random retry 8-char URL-safe slugs under 50ms keeping 413 and 404 behavior."
verify = "cargo test shows unique URL-safe 8-char slugs persisting across restarts with save/load round-trips under 50ms."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

