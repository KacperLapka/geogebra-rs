# Epic 5 — workspace persistence breakdown, in build order.
# Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: share link restores identical session"
description = "Thinnest serialize, POST slug, and load path for a styled session: version 1 JSON within 10KB, shortlink slug, primary /w/<slug> plus ?s=<slug> fallback restoring identical functions, params, and viewport."
verify = "Dev shares f(x)=a*x^2 in npm run dev, opens the link on a second device profile, and sees the identical curves, sliders, and viewport go live."
covers = ["R1", "R2", "R3"]
after = ["1.6"]
hitl = false
risk = "medium"

