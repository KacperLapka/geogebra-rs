[[entry]]
id = 7
type = "story"
title = "Canvas mount with pan, zoom, asymptotes, and fallback"
description = "Extends the tracer minimal mount into the full mount: canvas mounts the wgpu pipeline, pan by drag and zoom by wheel, buttons, or reset update the domain label and re-render the visible domain without refiring analysis; poles break curves with gray dashed asymptotes; the fallback message shows only when WebGPU and WebGL2 adapters both fail leaving the rest usable. R7 gray-dash breaks; R8 full mount, pan, zoom, and fallback; R9 viewport."
verify = "Panning and zooming update the domain label with analysis intact and reset restores the default domain; 1/x breaks at zero with a gray dashed asymptote; the fallback message appears only on double failure with the rest of the workspace usable."
covers = ["R7", "R8", "R9"]
after = [2, "3.1", "4.4"]
hitl = false
risk = "medium"

