# Function explorer frontend — epic story breakdown, in build order.
# Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "spike"
title = "Spike: DOM-overlay sync at 60 FPS"
description = "Enables entry 2 R5 and R6 and delivers nothing itself: time-boxed spike proves DOM button positioning over canvas geometry from the query_hover overlay shape without layout thrash and records the sync technique or the dead-ends tried."
verify = "Spike note names the positioning technique with measured frame cost or the dead-ends ruled out."
covers = []
after = ["1.2", "2.6"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Tracer: Analyze loop with single curve and marker buttons"
description = "Thinnest path through every layer the epic touches: type e^(0.5x), Analyze fires WASM, indigo f lands on a minimal canvas mount, root and extremum DOM buttons appear with tooltips. R1 happy-path fire only; R5 and R6 working buttons only; R8 minimal mount plus single indigo curve only (fallback indigo via scaffold pipeline; full palette lands in entry 8). A person sees the explorer working in the dev server."
verify = "A person types e^(0.5x), hits Analyze, and sees the indigo solid curve with root versus extrema and inflection buttons visually distinct showing coordinate tooltips; a marker-free view stays silent."
covers = ["R1", "R5", "R6", "R8"]
after = [1, "1.2", "2.6"]
hitl = true
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Function bar with errors and Try chips"
description = "R1 validation and errors part: char-exact errors within 50 ms block Analyze, the clear control empties to the empty state, Try chips fill and fire immediately, and errors hold the last good canvas."
verify = "Enter fires analysis; a mistyped character shows its caret error with Analyze disabled holding the last good canvas and clears within 50 ms of the fix; each Try chip fills the bar and analyzes."
covers = ["R1"]
after = [2]
hitl = false
risk = "low"

